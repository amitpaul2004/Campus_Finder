<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JISU - Broadcast Center</title>
    <link rel="icon" type="image/png" href="../img/favicon.png">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Broadcast.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <header class="college-header fixed-top">
        <div class="logo-wrapper">
            <a href="index.html">
                <img src="../img/logo-light.png" alt="JIS Logo" class="college-logo">
            </a>
        </div>
        <div class="header-content-left">
            <span class="portal-title">LIBRARIAN PORTAL</span>
            <div class="vertical-line"></div>
            <a href="../login.html" class="logout-btn"><i class="fa-solid fa-power-off"></i> Logout</a>
        </div>
    </header>

    <main class="dashboard-container">
        
        <div class="page-header">
            <a href="/Frontend/Librian/Librarian.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
            </a>
            <div class="header-text">
                <h1 class="title-gradient">Broadcast Alerts</h1>
                <p class="subtitle">Notify students & staff about lost items in real-time.</p>
            </div>
        </div>

        <div class="content-grid">
            
            <div class="compose-card glass-panel fade-in-up">
                <div class="card-title">
                    <div class="icon-circle"><i class="fa-solid fa-tower-broadcast"></i></div>
                    <h3>New Broadcast</h3>
                </div>
                
                <form id="broadcastForm" onsubmit="sendBroadcast(event)">
                    
                    <div class="input-group">
                        <label>Target Audience</label>
                        <div class="custom-select-wrapper">
                            <i class="fa-solid fa-users input-icon"></i>
                            <select id="targetAudience">
                                <option value="All Students">All Students & Faculty</option>
                                <option value="CSE Dept">CSE Department Only</option>
                                <option value="ECE Dept">ECE Department Only</option>
                                <option value="Hostelers">Hostel Residents</option>
                            </select>
                            <i class="fa-solid fa-chevron-down arrow-icon"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Subject Line</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-tag input-icon"></i>
                            <input type="text" id="msgSubject" placeholder="e.g. Wallet Found in Canteen" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Message Details</label>
                        <div class="textarea-wrapper">
                            <textarea id="msgBody" rows="5" placeholder="Describe the item and where to claim it..." required></textarea>
                        </div>
                    </div>

                    <div class="form-footer">
                        <label class="checkbox-container">
                            <input type="checkbox" id="emailToggle" checked>
                            <span class="checkmark"></span>
                            Also send via Email
                        </label>

                        <button type="submit" class="btn-broadcast">
                            <i class="fa-solid fa-paper-plane"></i> Publish Alert
                        </button>
                    </div>
                </form>
            </div>

            <div class="feed-panel fade-in-up delay-1">
                <div class="feed-header">
                    <h3>Recent Alerts</h3>
                    <div class="live-indicator">
                        <span class="dot"></span> Live Feed
                    </div>
                </div>

                <div class="feed-list" id="historyList">
                    </div>
            </div>

        </div>

    </main>

    <script src="Broadcast.js"></script>
</body>
</html>
